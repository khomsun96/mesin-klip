name: Mesin Klip

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Tautan YouTube (kosongkan untuk ambil video terbaru dari kanal.txt)"
        required: false
      jumlah:
        description: "Jumlah klip"
        required: false
        default: "2"
  push:
    paths:
      - antrian.txt
  schedule:
    # 06.40, 10.40, 17.40 WIB (UTC+7) supaya siap pukul 07.00, 11.00, 18.00
    - cron: "40 23 * * *"
    - cron: "40 3 * * *"
    - cron: "40 10 * * *"

permissions:
  contents: write

concurrency:
  group: mesin-klip
  cancel-in-progress: false

jobs:
  klip:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang alat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -U yt-dlp
          pip install -q -r requirements.txt

      - name: Cookies YouTube (opsional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then printf '%s' "$YT_COOKIES" > cookies.txt; fi

      - name: Buat klip
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NICHE: ${{ vars.NICHE || 'agama, psikologi, leadership' }}
          URL_VIDEO: ${{ inputs.url }}
          PEMICU: ${{ github.event_name }}
          JUMLAH_KLIP: ${{ inputs.jumlah || '2' }}
        run: python klip.py

      - name: Simpan klip
        if: hashFiles('hasil/*.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: klip-${{ github.run_number }}
          path: hasil/
          retention-days: 7

      - name: Ringkasan
        if: hashFiles('hasil/caption.md') != ''
        run: cat hasil/caption.md >> "$GITHUB_STEP_SUMMARY"

      - name: Catat riwayat
        run: |
          rm -f cookies.txt
          git config user.name "mesin-klip"
          git config user.email "actions@users.noreply.github.com"
          git add riwayat.txt
          git diff --cached --quiet || (git commit -m "Catat video yang sudah diproses" && git push)
